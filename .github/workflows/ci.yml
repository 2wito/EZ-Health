name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall runs `prisma generate`, which needs no database.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The build doesn't connect to a database either (the Prisma client is created on first use).
      - run: npm run build
